<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | AttendWise</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <div>
            <h1>Welcome back 👋</h1>
            <p>Your attendance at a glance.</p>
        </div>

    </header>


    <section class="stats">

        <div class="stat-card">

            <h3>Overall Attendance</h3>

            <h2>82%</h2>

            <p class="safe">SAFE</p>

        </div>

        <div class="stat-card">

            <h3>Present</h3>

            <h2>205</h2>

        </div>

        <div class="stat-card">

            <h3>Absent</h3>

            <h2>45</h2>

        </div>

        <div class="stat-card">

            <h3>Total Classes</h3>

            <h2>250</h2>

        </div>

    </section>


    <section class="today">

        <div class="section-header">
            <div>
                <h2>Today's Classes</h2>
                <p>Mark your attendance for today's classes.</p>
            </div>

            <span class="today-date" id="todayDate"></span>
        </div>

        <div class="class-list" id="classList">

            <!-- Classes will be added using JavaScript -->

        </div>

    </section>


    <section class="subjects">

    <h2>Your Subjects</h2>

    <div class="subject-grid" id="subjectGrid">

       

    </div>

    </section>

</div>
<script src="../js/script.js"></script>
</body>
</html>
